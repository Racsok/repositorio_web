name: CI - Validacion de Build Astro

on:
  push:
    branches: 
      - desarrollo
      - 'feat/**'
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar esquemas y tipos (Astro Check)
        run: npx astro check

      - name: Compilar sitio estático (Build)
        run: npm run build
